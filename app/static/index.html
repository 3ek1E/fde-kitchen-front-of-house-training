<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知味协作台</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><aside><a class="brand" href="/">知味 <span>协作台</span></a><p class="muted">后厨与前厅的共同工作空间</p><nav id="nav" hidden><button data-view="orders">出品交接</button><button data-view="wiki">知识 Wiki</button><button data-view="chat">知识问答</button><button data-view="admin">管理与审计</button></nav><div class="identity"><span id="who">请登录你的工作账号</span><button id="logout" hidden>退出登录</button></div></aside>
<main><header><div><p class="eyebrow">知味餐饮 · MVP</p><h1 id="heading">让每次交接都有依据</h1></div><span class="tag">合成演示数据</span></header><div id="status" role="status" aria-live="polite"></div>
<section id="login"><article class="card login"><h2>登录工作空间</h2><p class="muted">使用管理员为你分配的账号。</p><form id="login-form"><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">登录</button></form></article></section>
<section id="orders" hidden><div class="grid"><article class="card"><h2>订单行</h2><p class="muted">先核对备注与版本，再由前厅和后厨分别确认。</p><div id="order-list"></div></article><article class="card"><h2>登记订单事件</h2><form id="event-form"><label>来源<select name="source"><option value="pos">POS 演示数据</option><option value="paper">纸质加单</option></select></label><label>事件编号<input name="event_id" required></label><div class="row"><label>订单号<input name="order_no" required value="A008"></label><label>菜品行<input name="line_no" required value="01"></label></div><label>版本<input name="version" type="number" min="1" value="1" required></label><label>菜品与交接备注<textarea name="remark" required placeholder="填写菜品、关键备注与待确认事项"></textarea></label><button class="primary">登记事件</button></form></article></div><article class="card"><h2>交接事件与待办</h2><div id="event-list"></div></article></section>
<section id="wiki" hidden><div class="grid"><article class="card"><h2>知识库</h2><div id="wiki-list"></div><button id="new-page">新建草稿</button></article><article class="card"><h2>文档与修订</h2><form id="wiki-form"><input id="page-id" type="hidden"><label>标题<input id="page-title" required maxlength="150"></label><label>Markdown 原文<textarea id="page-content" rows="14" required></textarea></label><p id="revision" class="muted"></p><div class="row"><button class="primary" id="save-page">保存新修订</button><button type="button" id="publish-page">发布当前修订</button></div></form></article></div></section>
<section id="chat" hidden><article class="card"><h2>带依据的知识问答</h2><p class="muted">从当前租户已发布的 SOP 中检索，过敏与温度判断需人工复核。</p><form id="chat-form"><label>你的问题<textarea name="question" required maxlength="1000" placeholder="纸质加单与系统单冲突时应该怎么处理？"></textarea></label><button class="primary">查询知识库</button></form><div id="answer" class="answer"></div><div id="sources"></div></article></section>
<section id="admin" hidden><div id="tenant-admin" hidden class="card"><h2>租户管理</h2><div id="tenant-list"></div><form id="tenant-form"><label>新租户名称<input name="name" required></label><button class="primary">创建租户</button></form></div><div class="grid"><article class="card"><h2>创建用户</h2><form id="user-form"><label>邮箱<input name="email" type="email" required></label><label>初始密码<input name="password" type="password" minlength="12" required></label><label>角色<select name="role" id="role-options"></select></label><label>岗位<select name="station"><option value="front">前厅</option><option value="kitchen">后厨</option><option value="dispatch">调度</option></select></label><label id="tenant-field" hidden>租户编号<input name="tenant_id" type="number" min="1"></label><button class="primary">创建用户</button></form><div id="user-list"></div></article><article class="card"><h2>操作审计</h2><div id="audit-list"></div></article></div></section>
</main></body></html>
